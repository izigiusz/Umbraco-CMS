name: Build Check

on:
  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches:
      - main
      - release/*
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4

      - name: Restore dependencies
        run: dotnet restore src/Umbraco.Web.UI/Umbraco.Web.UI.csproj

      - name: Build
        run: dotnet build src/Umbraco.Web.UI/Umbraco.Web.UI.csproj -c Release --no-restore

      - name: Publish (dry-run)
        run: |
          dotnet publish src/Umbraco.Web.UI/Umbraco.Web.UI.csproj \
            -c Release \
            --no-build \
            --no-self-contained \
            -o ./publish-test
          
          echo "=== Verifying publish output ==="
          for f in web.config Umbraco.Web.UI.dll appsettings.template.json; do
            if [ -f "./publish-test/$f" ]; then
              echo "OK: $f exists"
            else
              echo "ERROR: $f is missing from publish output!"
              exit 1
            fi
          done
          echo "Build verification passed"
